# Node launch configuration:
# - node_allowlist allows only the listed nodes to be launched
# - node_log_levels overrides per-node log level; default is 'info'

# Node allowlist: Only launch these nodes
node_allowlist:
  # Global setup nodes
  - element_registrator
  - airsim
  # # Agent setup nodes
  - mavros_manager
  # Global runtime nodes
  - target_clustering
  - cluster_analysis
  - agent_assignment
  - agent_analysis
  - target_state
  - target_control
  # Agent runtime nodes
  - drone_frames
  - drone_state
  - drone_control
  - camera_frames
  - camera_control
  - agent_positioning
  - agent_tracking
  # Visualization runtime nodes
  - gui_manager
  - metrics_factory
  - marker_factory
  - rviz

# Per-node log level overrides
node_log_levels:
  # Global setup nodes
  element_registrator: info
  airsim: error
  # Agent setup nodes
  mavros_manager: info
  # Global runtime nodes
  target_clustering: info
  cluster_analysis: info
  agent_assignment: info
  agent_analysis: info
  target_state: info
  target_control: info
  # Agent runtime nodes
  drone_frames: info
  drone_state: info
  drone_control: info
  camera_frames: info
  camera_control: info
  agent_positioning: info
  agent_tracking: info
  # Visualization runtime nodes
  gui_manager: info
  metrics_factory: info
  marker_factory: info
  rviz: error