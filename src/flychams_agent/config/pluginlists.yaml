/**:
  ros__parameters:
    plugin_allowlist:
      - command              # Command services (arm, takeoff, land, set_mode)
      - global_position      # Global position data
      - home_position        # Home position
      - local_position       # Local position & odometry
      - setpoint_position    # Position setpoints
      - sys_status           # System status & heartbeat
      - sys_time             # Time synchronization