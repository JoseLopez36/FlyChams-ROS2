# Node launch configuration:
# - node_allowlist allows only the listed nodes to be launched
# - node_log_levels overrides per-node log level; default is 'error'

# Node allowlist: Only launch these nodes
node_allowlist:
  - agent_frames
  - agent_state
  - agent_control
  - agent_analysis
  - agent_positioning
  - agent_tracking
  - agent_stream

# Per-node log level overrides
node_log_levels:
  agent_frames: "warn"
  agent_state: "warn"
  agent_control: "warn"
  agent_analysis: "warn"
  agent_positioning: "warn"
  agent_tracking: "warn"
  agent_stream: "warn"