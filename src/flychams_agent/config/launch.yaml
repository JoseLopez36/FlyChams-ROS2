# Node launch configuration:
# - node_allowlist allows only the listed nodes to be launched
# - node_log_levels overrides per-node log level; default is 'info'

# Node allowlist: Only launch these nodes
node_allowlist:
  - drone_frames
  - drone_state
  - drone_control
  - camera_frames
  - agent_analysis
  - agent_positioning
  - agent_tracking
  - agent_stream
  # - target_detection

# Per-node log level overrides
node_log_levels:
  drone_frames: "info"
  drone_state: "info"
  drone_control: "info"
  camera_frames: "info"
  agent_analysis: "info"
  agent_positioning: "info"
  agent_tracking: "info"
  agent_stream: "info"
  target_detection: "info"