# Node launch configuration:
# - node_allowlist allows only the listed nodes to be launched
# - node_log_levels overrides per-node log level; default is 'error'

# Node allowlist: Only launch these nodes
node_allowlist:
  - target_state
  - target_control
  - agent_bridge
  - simulation_stream

# Per-node log level overrides
node_log_levels:
  target_state: "info"
  target_control: "info"
  agent_bridge: "error"
  simulation_stream: "info"