# Node launch configuration:
# - node_allowlist allows only the listed nodes to be launched
# - node_log_levels overrides per-node log level; default is 'error'

# Node allowlist: Only launch these nodes
node_allowlist:
  - element_registrator
  - mission_state
  - fleet_state
  - target_clustering
  - cluster_analysis
  - agent_assignment

# Per-node log level overrides
node_log_levels:
  element_registrator: "info"
  mission_state: "warn"
  fleet_state: "warn"
  target_clustering: "warn"
  cluster_analysis: "warn"
  agent_assignment: "warn"