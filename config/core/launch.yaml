# Node launch configuration:
# - node_allowlist allows only the listed nodes to be launched
# - node_log_levels overrides per-node log level; default is 'info'

# Node allowlist: Only launch these nodes
node_allowlist:
  # Coordinator nodes
  - element_registrator
  - target_clustering
  - cluster_analysis
  - agent_assignment
  # Agent nodes
  - mavros_manager
  - drone_frames
  - drone_state
  - drone_control
  - camera_frames
  - camera_control
  - agent_analysis
  - agent_positioning
  - agent_tracking
  - target_detection
  # Operator nodes
  - metrics_factory
  - marker_factory
  - rviz
  # Simulation nodes
  - airsim
  - simulation_gui
  - target_state
  - target_control

# Per-node log level overrides
node_log_levels:
  # Coordinator nodes
  element_registrator: "info"
  target_clustering: "error"
  cluster_analysis: "error"
  agent_assignment: "error"
  # Agent nodes
  mavros_manager: "error"
  drone_frames: "error"
  drone_state: "error"
  drone_control: "error"
  camera_frames: "error"
  camera_control: "error"
  agent_analysis: "error"
  agent_positioning: "error"
  agent_tracking: "error"
  target_detection: "info"
  # Operator nodes
  metrics_factory: "error"
  marker_factory: "error"
  rviz: "error"
  # Simulation nodes
  airsim: "error"
  simulation_gui: "error"
  target_state: "error"
  target_control: "error"