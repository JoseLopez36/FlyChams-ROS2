[workspace]
name = "flychams-ros2"
authors = ["Jose Francisco Lopez Ruiz <josloprui6@alum.us.es>"]
channels = ["robostack-humble", "conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"


[dependencies]
# ROS2 base
ros-humble-ros-base = ">=0.10.0,<0.11"

# Compilation tools
ros-humble-ament-cmake-auto = ">=1.3.12,<2"
compilers = ">=1.11.0,<2"
pkg-config = ">=0.29.2,<0.30"
cmake = "3.26.*"
ninja = ">=1.13.2,<2"
colcon-common-extensions = ">=0.3.0,<0.4"
setuptools = "<=58.2.0"

# ROS dependencies
ros-humble-geographic-msgs = ">=1.0.6,<2"
ros-humble-vision-opencv = ">=3.2.1,<4"


[feature.operator.dependencies]
ros-humble-rviz2 = ">=11.2.18,<12"
ros-humble-rqt-gui = ">=1.1.7,<2"


[feature.coordinator.dependencies]


[feature.simulation.dependencies]


[environments]
default = ["operator", "coordinator", "simulation"]
operator = ["operator"]
coordinator = ["coordinator"]
simulation = ["simulation"]

[tasks]
# Build tasks
clean = "rm -rf build/ install/ log/"
build = """
colcon build \
  --symlink-install \
  --cmake-args \
  -G Ninja \
  -DPython3_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  -DPython_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python
"""
operator-build = """
colcon build \
  --symlink-install \
  --cmake-args \
  -G Ninja \
  -DPython3_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  -DPython_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  --packages-up-to flychams_operator
"""
coordinator-build = """
colcon build \
  --symlink-install \
  --cmake-args \
  -G Ninja \
  -DPython3_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  -DPython_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  --packages-up-to flychams_coordinator
"""
simulation-build = """
colcon build \
  --symlink-install \
  --cmake-args \
  -G Ninja \
  -DPython3_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  -DPython_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  --packages-up-to flychams_simulation
"""

# Agent Docker tasks
agent-build-image = "bash tools/docker/build.sh"
agent-build = "bash tools/agent_setup.sh build"
agent-run = "bash tools/agent_setup.sh run"
agent-stop = "bash tools/agent_setup.sh stop"
agent-shell = "bash tools/agent_setup.sh shell"


[activation]
scripts = ["tools/setup.sh", "install/setup.sh"]
