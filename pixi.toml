[workspace]
name = "flychams-ros2"
authors = ["Jose Francisco Lopez Ruiz <josloprui6@alum.us.es>"]
channels = ["robostack-humble", "conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
# ROS2 base
ros-humble-ros-base = ">=0.10.0,<0.11"

# Compilation tools
ros-humble-ament-cmake-auto = ">=1.3.12,<2"
compilers = ">=1.11.0,<2"
pkg-config = ">=0.29.2,<0.30"
cmake = "3.26.*"
ninja = ">=1.13.2,<2"
colcon-common-extensions = ">=0.3.0,<0.4"
setuptools = "<=58.2.0"

# ROS dependencies
ros-humble-geographic-msgs = ">=1.0.6,<2"
ros-humble-vision-opencv = ">=3.2.1,<4"


[feature.operator.dependencies]
ros-humble-rviz2 = ">=11.2.18,<12"
ros-humble-rqt-gui = ">=1.1.7,<2"
pyqt = ">=5.15.11,<6"
gstreamer = ">=1.24.11,<2"
gst-plugins-base = ">=1.24.11,<2"
gst-plugins-good = ">=1.24.11,<2"
gst-plugins-bad = ">=1.24.11,<2"
gst-plugins-ugly = ">=1.24.11,<2"
gst-libav = ">=1.24.11,<2"


[feature.coordinator.dependencies]


[feature.simulation.dependencies]


[environments]
default = ["operator", "coordinator", "simulation"]
operator = ["operator"]
coordinator = ["coordinator"]
simulation = ["simulation"]

[tasks]
# Build tasks
clean = "rm -rf build/ install/ log/"
operator-build = """
colcon build \
  --symlink-install \
  --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -G Ninja \
  -DPython3_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  -DPython_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  --packages-up-to flychams_operator \
  --event-handlers console_direct+ 2>&1
"""
coordinator-build = """
colcon build \
  --symlink-install \
  --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -G Ninja \
  -DPython3_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  -DPython_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  --packages-up-to flychams_coordinator \
  --event-handlers console_direct+ 2>&1
"""
simulation-build = """
colcon build \
  --symlink-install \
  --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -G Ninja \
  -DPython3_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  -DPython_EXECUTABLE=$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python \
  --packages-up-to flychams_simulation airsim_wrapper \
  --event-handlers console_direct+ 2>&1
"""

# Setup tasks
generate-settings = "ros2 launch launch/generate_settings.launch.py"

# Operator tasks
operator-sim-run = "ros2 launch launch/operator.launch.py is_sim:=True"
operator-hardware-run = "ros2 launch launch/operator.launch.py is_sim:=False"
operator-rviz = "ros2 run rviz2 rviz2 -d config/rviz/default.rviz"

# Coordinator tasks
coordinator-sim-run = "ros2 launch launch/coordinator.launch.py is_sim:=True"
coordinator-hardware-run = "ros2 launch launch/coordinator.launch.py is_sim:=False"

# Agent simulation tasks (docker)
agent-sim-build-image = "bash tools/docker/build.sh"
agent-sim-build = "bash tools/agent_setup.sh build"
agent-sim-run = "bash tools/agent_setup.sh run"
agent-sim-stop = "bash tools/agent_setup.sh stop"
agent-sim-remove = "bash tools/agent_setup.sh remove"
agent-sim-shell = "bash tools/agent_setup.sh shell"

# Agent hardware tasks
agent-hardware-run = "ros2 launch launch/agent.launch.py is_sim:=False"

# Simulation tasks
simulation-run = "ros2 launch launch/simulation.launch.py"
simulation-ue5-run = "bash tools/launch_ue5.sh"
simulation-px4-run = "bash tools/docker/launch_px4.sh"


[activation]
scripts = ["setup.sh", "install/setup.sh"]
